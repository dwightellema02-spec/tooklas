<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 328" width="480" height="328" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Distance, speed and time</title><desc id="d">The distance, speed and time triangle with D on top and S and T below, giving distance equals speed times time, speed equals distance divided by time and time equals distance divided by speed. Example: 60 kilometers per hour for 2 hours is 120 kilometers.</desc><rect width="480" height="328" fill="#ffffff"/><polygon points="140,40 60,190 220,190" fill="#f1f5f9" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/><line x1="100" y1="115" x2="180" y2="115" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/><line x1="140" y1="115" x2="140" y2="190" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/><text x="140" y="85" font-size="24" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">D</text><text x="100" y="158" font-size="24" fill="#1d4ed8" text-anchor="middle" font-weight="700" dominant-baseline="middle">S</text><text x="180" y="158" font-size="24" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">T</text><text x="140" y="212" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">cover the one you want</text><text x="300" y="60" font-size="20" fill="#0f766e" text-anchor="start" font-weight="700" dominant-baseline="middle">D = S × T</text><text x="300" y="82" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle">distance = speed × time</text><text x="300" y="112" font-size="20" fill="#1d4ed8" text-anchor="start" font-weight="700" dominant-baseline="middle">S = D ÷ T</text><text x="300" y="134" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle">speed = distance ÷ time</text><text x="300" y="164" font-size="20" fill="#b45309" text-anchor="start" font-weight="700" dominant-baseline="middle">T = D ÷ S</text><text x="300" y="186" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle">time = distance ÷ speed</text><line x1="40" y1="292" x2="440" y2="292" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/><circle cx="40" cy="292" r="6" fill="#15803d" stroke="#15803d" stroke-width="1"/><circle cx="440" cy="292" r="6" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><path d="M 40 278 L 40 272 L 440 272 L 440 278" fill="none" stroke="#0f766e" stroke-width="2"/><text x="240" y="256" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">60 km/h × 2 h = 120 km</text><text x="40" y="312" font-size="11" fill="#15803d" text-anchor="middle" font-weight="400" dominant-baseline="middle">start</text><text x="440" y="312" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="400" dominant-baseline="middle">120 km</text></svg>
