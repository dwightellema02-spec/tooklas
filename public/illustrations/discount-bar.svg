<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 270" width="410" height="270" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Discount and sale price shown with bars</title><desc id="d">An 800 peso shirt is 100 percent. A 25 percent discount takes off 200 pesos, so the sale price is 600 pesos, which is 75 percent of the original price.</desc><rect width="410" height="270" fill="#ffffff"/><text x="205" y="24" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">A ₱800 shirt at 25% off</text><text x="40" y="66" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle">Original price</text><rect x="40" y="76" width="320" height="40" rx="5" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/><text x="200" y="96" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱800 = 100%</text><rect x="40" y="140" width="240" height="40" rx="5" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="160" y="160" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">sale price ₱600 (75%)</text><rect x="280" y="140" width="80" height="40" rx="5" fill="#fde68a" stroke="#b45309" stroke-width="2"/><text x="320" y="160" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱200</text><text x="320" y="196" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">discount 25%</text><text x="40" y="226" font-size="13" fill="#1e293b" text-anchor="start" font-weight="400" dominant-baseline="middle">Discount = 25% of ₱800 = ₱200</text><text x="40" y="248" font-size="13" fill="#0f766e" text-anchor="start" font-weight="700" dominant-baseline="middle">Sale price = ₱800 − ₱200 = ₱600</text></svg>
