<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Angles of a regular octagon</title><desc id="d">A regular octagon with each exterior angle 45 degrees, each interior angle 135 degrees and each angle at the center 45 degrees.</desc><rect width="520" height="270" fill="#ffffff"/><polygon points="131.7,47.6 77.6,101.7 77.6,178.3 131.7,232.4 208.3,232.4 262.4,178.3 262.4,101.7 208.3,47.6" fill="#f1f5f9" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/><line x1="170" y1="140" x2="131.7" y2="47.6" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><line x1="170" y1="140" x2="77.6" y2="101.7" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><path d="M 170 140 L 159.3 114.1 A 28 28 0 0 0 144.1 129.3 Z" fill="#1d4ed8" fill-opacity="0.28" stroke="none"/><path d="M 159.3 114.1 A 28 28 0 0 0 144.1 129.3" fill="none" stroke="#1d4ed8" stroke-width="2.5"/><text x="137.5" y="107.5" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700" dominant-baseline="middle">45°</text><line x1="131.7" y1="232.4" x2="174.2" y2="274.8" stroke="#b91c1c" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/><path d="M 131.7 232.4 L 161.7 232.4 A 30 30 0 0 0 110.5 211.2 Z" fill="#0f766e" fill-opacity="0.28" stroke="none"/><path d="M 161.7 232.4 A 30 30 0 0 0 110.5 211.2" fill="none" stroke="#0f766e" stroke-width="2.5"/><text x="151.6" y="184.3" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">135°</text><path d="M 131.7 232.4 L 157.2 257.8 A 36 36 0 0 0 167.7 232.4 Z" fill="#b45309" fill-opacity="0.28" stroke="none"/><path d="M 157.2 257.8 A 36 36 0 0 0 167.7 232.4" fill="none" stroke="#b45309" stroke-width="2.5"/><text x="183.5" y="253.8" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">45°</text><circle cx="170" cy="140" r="4" fill="#1e293b" stroke="#1e293b" stroke-width="1"/><text x="400" y="70" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Regular octagon</text><text x="400" y="100" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">exterior angle</text><text x="400" y="118" font-size="13" fill="#b45309" text-anchor="middle" font-weight="400" dominant-baseline="middle">360° ÷ 8 = 45°</text><text x="400" y="154" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">interior angle</text><text x="400" y="172" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="400" dominant-baseline="middle">180° − 45° = 135°</text><text x="400" y="208" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700" dominant-baseline="middle">angle at the center</text><text x="400" y="226" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="400" dominant-baseline="middle">360° ÷ 8 = 45°</text></svg>
