<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 215" width="480" height="215" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Angles of regular polygons</title><desc id="d">A regular pentagon has interior angles of 108 degrees, a regular hexagon 120, a regular octagon 135 and a regular decagon 144.</desc><rect width="480" height="215" fill="#ffffff"/><polygon points="33,47.8 16.3,99.2 60,131 103.7,99.2 87,47.8" fill="#f1f5f9" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/><path d="M 33 47.8 L 26.8 66.8 A 20 20 0 0 0 53 47.8 Z" fill="#0f766e" fill-opacity="0.28" stroke="none"/><path d="M 26.8 66.8 A 20 20 0 0 0 53 47.8" fill="none" stroke="#0f766e" stroke-width="2.5"/><text x="54.7" y="77.7" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">108°</text><text x="60" y="153" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Pentagon</text><text x="60" y="171" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">each angle 108°</text><text x="60" y="189" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">sum 540°</text><polygon points="157,45.2 134,85 157,124.8 203,124.8 226,85 203,45.2" fill="#f1f5f9" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/><path d="M 157 45.2 L 147 62.5 A 20 20 0 0 0 177 45.2 Z" fill="#0f766e" fill-opacity="0.28" stroke="none"/><path d="M 147 62.5 A 20 20 0 0 0 177 45.2" fill="none" stroke="#0f766e" stroke-width="2.5"/><text x="175.5" y="77.2" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">120°</text><text x="180" y="153" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Hexagon</text><text x="180" y="171" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">each angle 120°</text><text x="180" y="189" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">sum 720°</text><polygon points="282.4,42.5 257.5,67.4 257.5,102.6 282.4,127.5 317.6,127.5 342.5,102.6 342.5,67.4 317.6,42.5" fill="#f1f5f9" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/><path d="M 282.4 42.5 L 268.3 56.6 A 20 20 0 0 0 302.4 42.5 Z" fill="#0f766e" fill-opacity="0.28" stroke="none"/><path d="M 268.3 56.6 A 20 20 0 0 0 302.4 42.5" fill="none" stroke="#0f766e" stroke-width="2.5"/><text x="296.6" y="76.7" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">135°</text><text x="300" y="153" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Octagon</text><text x="300" y="171" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">each angle 135°</text><text x="300" y="189" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">sum 1,080°</text><polygon points="405.8,41.3 382.8,58 374,85 382.8,112 405.8,128.7 434.2,128.7 457.2,112 466,85 457.2,58 434.2,41.3" fill="#f1f5f9" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/><path d="M 405.8 41.3 L 389.6 53 A 20 20 0 0 0 425.8 41.3 Z" fill="#0f766e" fill-opacity="0.28" stroke="none"/><path d="M 389.6 53 A 20 20 0 0 0 425.8 41.3" fill="none" stroke="#0f766e" stroke-width="2.5"/><text x="417.2" y="76.4" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">144°</text><text x="420" y="153" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Decagon</text><text x="420" y="171" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">each angle 144°</text><text x="420" y="189" font-size="12" fill="#64748b" text-anchor="middle" font