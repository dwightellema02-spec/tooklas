<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 285" width="420" height="285" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Sales tax and commission shown with bars</title><desc id="d">A price of 25,000 pesos plus a 12 percent tax of 3,000 pesos gives a total of 28,000 pesos. A seller with 45,000 pesos of sales and an 8 percent commission earns 3,600 pesos.</desc><rect width="420" height="285" fill="#ffffff"/><text x="210" y="22" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Sales tax and commission</text><text x="30" y="58" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle">Price ₱25,000 + 12% VAT</text><rect x="30" y="68" width="250" height="36" rx="5" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="155" y="86" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">price ₱25,000</text><rect x="280" y="68" width="30" height="36" rx="5" fill="#fde68a" stroke="#b45309" stroke-width="2"/><text x="295" y="120" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">tax ₱3,000</text><text x="30" y="142" font-size="13" fill="#1e293b" text-anchor="start" font-weight="700" dominant-baseline="middle">Total = ₱25,000 + ₱3,000 = ₱28,000</text><text x="30" y="184" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle">Sales of ₱45,000 and 8% commission</text><rect x="30" y="194" width="270" height="36" rx="5" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/><text x="165" y="212" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">sales ₱45,000</text><rect x="300" y="194" width="22" height="36" rx="5" fill="#fde68a" stroke="#b45309" stroke-width="2"/><text x="311" y="246" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">commission ₱3,600</text><text x="30" y="266" font-size="13" fill="#1e293b" text-anchor="start" font-weight="700" dominant-baseline="middle">Commission = 8% × ₱45,000 = ₱3,600</text></svg>
