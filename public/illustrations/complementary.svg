<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 240" width="530" height="240" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Complementary angles</title><desc id="d">A right angle of 90 degrees is split into an angle of 35 degrees and an angle of 55 degrees. Complementary angles add up to 90 degrees.</desc><rect width="530" height="240" fill="#ffffff"/><line x1="110" y1="215" x2="360" y2="215" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/><line x1="110" y1="215" x2="110" y2="25" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/><line x1="110" y1="215" x2="261.5" y2="108.9" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/><polyline points="126,215 126,199 110,199" fill="none" stroke="#64748b" stroke-width="2"/><path d="M 110 215 L 220 215 A 110 110 0 0 0 200.1 151.9 Z" fill="#0f766e" fill-opacity="0.28"/><path d="M 220 215 A 110 110 0 0 0 200.1 151.9" fill="none" stroke="#0f766e" stroke-width="3"/><path d="M 110 215 L 183.7 163.4 A 90 90 0 0 0 110 125 Z" fill="#b45309" fill-opacity="0.28"/><path d="M 183.7 163.4 A 90 90 0 0 0 110 125" fill="none" stroke="#b45309" stroke-width="3"/><text x="241" y="182.3" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">35°</text><text x="159.1" y="114.3" font-size="17" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">55°</text><circle cx="110" cy="215" r="5" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><text x="395" y="90" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Complementary angles</text><text x="395" y="118" font-size="18" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">35° + 55° = 90°</text><text x="395" y="146" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">together they make a right angle</text></svg>
