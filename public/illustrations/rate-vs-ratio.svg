<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 485 255" width="485" height="255" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A ratio and a rate</title><desc id="d">A ratio compares 3 boys to 5 girls, which are both children and so the same unit. A rate compares 120 pesos for 3 kilograms, which are different units.</desc><rect width="485" height="255" fill="#ffffff"/><rect x="15" y="15" width="220" height="225" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><rect x="250" y="15" width="220" height="225" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="125" y="40" font-size="17" fill="#1d4ed8" text-anchor="middle" font-weight="700" dominant-baseline="middle">Ratio</text><text x="125" y="60" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">same unit</text><circle cx="60" cy="105" r="11" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><circle cx="90" cy="105" r="11" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><circle cx="120" cy="105" r="11" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><circle cx="45" cy="145" r="11" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><circle cx="75" cy="145" r="11" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><circle cx="105" cy="145" r="11" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><circle cx="135" cy="145" r="11" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><circle cx="165" cy="145" r="11" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><text x="125" y="185" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">3 boys to 5 girls</text><text x="125" y="207" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">both are children</text><text x="360" y="40" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">Rate</text><text x="360" y="60" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">different units</text><rect x="290" y="90" width="26" height="34" rx="5" fill="#fde68a" stroke="#b45309" stroke-width="2"/><text x="303" y="107" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">kg</text><rect x="324" y="90" width="26" height="34" rx="5" fill="#fde68a" stroke="#b45309" stroke-width="2"/><text x="337" y="107" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">kg</text><rect x="358" y="90" width="26" height="34" rx="5" fill="#fde68a" stroke="#b45309" stroke-width="2"/><text x="371" y="107" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">kg</text><circle cx="420" cy="107" r="20" fill="#99f6e4" stroke="#0f766e" stroke-width="2.5"/><text x="420" y="107" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱120</text><text x="360" y="160" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱120 for 3 kg</text><text x="360" y="182" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">pesos and kilograms</text><text x="360" y="214" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">per = for each one</text></svg>
