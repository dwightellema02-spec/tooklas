<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 252" width="500" height="252" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A double number line for a unit rate</title><desc id="d">Two number lines side by side. Kilograms 0, 1, 2 and 3 line up with pesos 0, 40, 80 and 120, so 1 kilogram costs 40 pesos, which is the unit rate.</desc><rect width="500" height="252" fill="#ffffff"/><text x="250" y="22" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱120 for 3 kg: find the price for 1 kg</text><text x="30" y="82" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">kg</text><text x="30" y="172" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱</text><line x1="70" y1="82" x2="420" y2="82" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/><line x1="70" y1="172" x2="420" y2="172" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><line x1="70" y1="74" x2="70" y2="90" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/><line x1="70" y1="164" x2="70" y2="180" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/><line x1="70" y1="90" x2="70" y2="164" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/><text x="70" y="62" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">0</text><text x="70" y="196" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">0</text><line x1="180" y1="74" x2="180" y2="90" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/><line x1="180" y1="164" x2="180" y2="180" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/><line x1="180" y1="90" x2="180" y2="164" stroke="#b45309" stroke-width="3" stroke-linecap="round"/><text x="180" y="62" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">1</text><text x="180" y="196" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">40</text><line x1="290" y1="74" x2="290" y2="90" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/><line x1="290" y1="164" x2="290" y2="180" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/><line x1="290" y1="90" x2="290" y2="164" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/><text x="290" y="62" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">2</text><text x="290" y="196" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">80</text><line x1="400" y1="74" x2="400" y2="90" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/><line x1="400" y1="164" x2="400" y2="180" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/><line x1="400" y1="90" x2="400" y2="164" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/><text x="400" y="62" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">3</text><text x="400" y="196" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">120</text><rect x="142" y="112" width="76" height="28" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/><text x="180" y="126" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">1 kg = ₱40</text><text x="250" y="232" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">120 ÷ 3 = 40   →   ₱40 per kilogram (the unit rate)</text></svg>
