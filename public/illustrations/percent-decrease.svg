<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 275" width="400" height="275" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A percentage decrease shown with bars</title><desc id="d">A bar for the original price of 500 pesos is 100 percent. The new price is 400 pesos, and the missing 100 pesos is 20 percent of the original, so the decrease is 20 percent.</desc><rect width="400" height="275" fill="#ffffff"/><text x="200" y="24" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱500 falls to ₱400</text><text x="40" y="66" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle">Original</text><rect x="40" y="76" width="300" height="38" rx="5" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="190" y="95" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱500 = 100%</text><text x="40" y="146" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle">New</text><rect x="40" y="156" width="240" height="38" rx="5" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="160" y="175" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱400</text><rect x="280" y="156" width="60" height="38" rx="5" fill="#fecaca" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/><text x="310" y="175" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700" dominant-baseline="middle">−₱100</text><path d="M 280 206 L 280 214 L 340 214 L 340 206" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="310" y="232" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="400" dominant-baseline="middle">decrease ÷ original</text><text x="310" y="252" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="700" dominant-baseline="middle">100 ÷ 500 = 0.20 = 20%</text></svg>
