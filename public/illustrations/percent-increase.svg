<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 275" width="400" height="275" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A percentage increase shown with bars</title><desc id="d">A bar for the original price of 200 pesos is 100 percent. The new price bar is the same length plus an extra 80 pesos, which is 40 percent of the original, so the increase is 40 percent.</desc><rect width="400" height="275" fill="#ffffff"/><text x="200" y="24" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱200 rises to ₱280</text><text x="40" y="66" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle">Original</text><rect x="40" y="76" width="200" height="38" rx="5" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="140" y="95" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱200 = 100%</text><text x="40" y="146" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle">New</text><rect x="40" y="156" width="200" height="38" rx="5" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="140" y="175" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱200</text><rect x="240" y="156" width="80" height="38" rx="5" fill="#fde68a" stroke="#b45309" stroke-width="2"/><text x="280" y="175" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">+₱80</text><path d="M 240 206 L 240 214 L 320 214 L 320 206" fill="none" stroke="#b45309" stroke-width="2"/><text x="280" y="232" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" dominant-baseline="middle">increase ÷ original</text><text x="280" y="252" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">80 ÷ 200 = 0.40 = 40%</text></svg>
