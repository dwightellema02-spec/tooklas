<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Polygons named by their number of sides</title><desc id="d">Regular polygons from the triangle with 3 sides to the decagon with 10 sides, each with its name.</desc><rect width="480" height="320" fill="#ffffff"/><polygon points="60,28 23.6,91 96.4,91" fill="#99f6e4" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"/><text x="60" y="132" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Triangle</text><text x="60" y="150" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">3 sides</text><polygon points="150.3,40.3 150.3,99.7 209.7,99.7 209.7,40.3" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/><text x="180" y="132" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Quadrilateral</text><text x="180" y="150" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">4 sides</text><polygon points="300,28 260.1,57 275.3,104 324.7,104 339.9,57" fill="#99f6e4" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"/><text x="300" y="132" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Pentagon</text><text x="300" y="150" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">5 sides</text><polygon points="399,33.6 378,70 399,106.4 441,106.4 462,70 441,33.6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/><text x="420" y="132" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Hexagon</text><text x="420" y="150" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">6 sides</text><polygon points="60,163 27.2,178.8 19.1,214.3 41.8,242.8 78.2,242.8 100.9,214.3 92.8,178.8" fill="#99f6e4" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"/><text x="60" y="267" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Heptagon</text><text x="60" y="285" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">7 sides</text><polygon points="163.9,166.2 141.2,188.9 141.2,221.1 163.9,243.8 196.1,243.8 218.8,221.1 218.8,188.9 196.1,166.2" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/><text x="180" y="267" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Octagon</text><text x="180" y="285" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">8 sides</text><polygon points="300,163 273,172.8 258.6,197.7 263.6,226 285.6,244.5 314.4,244.5 336.4,226 341.4,197.7 327,172.8" fill="#99f6e4" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"/><text x="300" y="267" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Nonagon</text><text x="300" y="285" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">9 sides</text><polygon points="407,165.1 386,180.3 378,205 386,229.7 407,244.9 433,244.9 454,229.7 462,205 454,180.3 433,165.1" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/><text x="420" y="267" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Decagon</text><text x="420" y="285" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">10 sides</text></svg>
