<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">An exterior angle and its adjacent interior angle</title><desc id="d">At a vertex of a polygon the interior angle of 80 degrees and the exterior angle of 100 degrees lie along a straight line, so they add up to 180 degrees.</desc><rect width="480" height="250" fill="#ffffff"/><line x1="30" y1="190" x2="210" y2="190" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/><line x1="210" y1="190" x2="440" y2="190" stroke="#b91c1c" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/><line x1="210" y1="190" x2="192.6" y2="91.5" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/><path d="M 210 190 L 199.6 130.9 A 60 60 0 0 0 150 190 Z" fill="#0f766e" fill-opacity="0.28"/><path d="M 199.6 130.9 A 60 60 0 0 0 150 190" fill="none" stroke="#0f766e" stroke-width="3"/><path d="M 210 190 L 288 190 A 78 78 0 0 0 196.5 113.2 Z" fill="#b45309" fill-opacity="0.28"/><path d="M 288 190 A 78 78 0 0 0 196.5 113.2" fill="none" stroke="#b45309" stroke-width="3"/><text x="133.4" y="125.7" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">80°</text><text x="283.5" y="116.5" font-size="17" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">100°</text><text x="125.4" y="147.7" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="400" dominant-baseline="middle">interior</text><text x="289.5" y="136.5" font-size="11" fill="#b45309" text-anchor="middle" font-weight="400" dominant-baseline="middle">exterior</text><circle cx="210" cy="190" r="5" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><text x="240" y="24" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">exterior + adjacent interior = 180°</text><text x="240" y="52" font-size="17" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">100° + 80° = 180°</text><text x="240" y="232" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">they form a linear pair along the extended side</text></svg>
