<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The exterior angles of a polygon add up to 360 degrees</title><desc id="d">A hexagon with one side extended at each vertex and one exterior angle marked at each vertex. All six exterior angles together make one full turn of 360 degrees.</desc><rect width="480" height="300" fill="#ffffff"/><polygon points="240,67 172.5,106 172.5,184 240,223 307.5,184 307.5,106" fill="#f1f5f9" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/><line x1="240" y1="67" x2="195" y2="41" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M 240 67 L 210.6 50 A 34 34 0 0 0 210.6 84 Z" fill="#0f766e" fill-opacity="0.45"/><path d="M 210.6 50 A 34 34 0 0 0 210.6 84" fill="none" stroke="#0f766e" stroke-width="2.5"/><line x1="172.5" y1="106" x2="127.4" y2="132" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M 172.5 106 L 143 123 A 34 34 0 0 0 172.5 140 Z" fill="#b45309" fill-opacity="0.45"/><path d="M 143 123 A 34 34 0 0 0 172.5 140" fill="none" stroke="#b45309" stroke-width="2.5"/><line x1="172.5" y1="184" x2="172.5" y2="236" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M 172.5 184 L 172.5 218 A 34 34 0 0 0 201.9 201 Z" fill="#1d4ed8" fill-opacity="0.45"/><path d="M 172.5 218 A 34 34 0 0 0 201.9 201" fill="none" stroke="#1d4ed8" stroke-width="2.5"/><line x1="240" y1="223" x2="285" y2="249" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M 240 223 L 269.4 240 A 34 34 0 0 0 269.4 206 Z" fill="#b91c1c" fill-opacity="0.45"/><path d="M 269.4 240 A 34 34 0 0 0 269.4 206" fill="none" stroke="#b91c1c" stroke-width="2.5"/><line x1="307.5" y1="184" x2="352.6" y2="158" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M 307.5 184 L 337 167 A 34 34 0 0 0 307.5 150 Z" fill="#15803d" fill-opacity="0.45"/><path d="M 337 167 A 34 34 0 0 0 307.5 150" fill="none" stroke="#15803d" stroke-width="2.5"/><line x1="307.5" y1="106" x2="307.5" y2="54" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M 307.5 106 L 307.5 72 A 34 34 0 0 0 278.1 89 Z" fill="#64748b" fill-opacity="0.45"/><path d="M 307.5 72 A 34 34 0 0 0 278.1 89" fill="none" stroke="#64748b" stroke-width="2.5"/><text x="240" y="22" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">One exterior angle at each vertex</text><text x="240" y="262" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">Add all six exterior angles: 360°, the full turn</text><text x="240" y="282" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">(this is true for every polygon)</text></svg>
