<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 290" width="590" height="290" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Drawing a quadrilateral with given angles</title><desc id="d">Quadrilateral ABCD with AB equal to 6 centimeters, AD equal to 4 centimeters, right angles at A and B, 100 degrees at D and 80 degrees at C. Steps are listed beside the figure.</desc><rect width="590" height="290" fill="#ffffff"/><polygon points="90,250 330,250 330,47.7 90,90" fill="#f1f5f9" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/><polyline points="104,250 104,236 90,236" fill="none" stroke="#1e293b" stroke-width="2"/><polyline points="330,236 316,236 316,250" fill="none" stroke="#1e293b" stroke-width="2"/><path d="M 90 90 L 90 116 A 26 26 0 0 0 115.6 85.5 Z" fill="#0f766e" fill-opacity="0.28" stroke="none"/><path d="M 90 116 A 26 26 0 0 0 115.6 85.5" fill="none" stroke="#0f766e" stroke-width="2.5"/><text x="125.2" y="119.6" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">100°</text><path d="M 330 47.7 L 304.4 52.2 A 26 26 0 0 0 330 73.7 Z" fill="#b45309" fill-opacity="0.28" stroke="none"/><path d="M 304.4 52.2 A 26 26 0 0 0 330 73.7" fill="none" stroke="#b45309" stroke-width="2.5"/><text x="300.4" y="82.9" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">80°</text><text x="118" y="238" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">90°</text><text x="300" y="238" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">90°</text><circle cx="90" cy="250" r="5" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><circle cx="330" cy="250" r="5" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><circle cx="330" cy="47.7" r="5" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><circle cx="90" cy="90" r="5" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><text x="76" y="262" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">A</text><text x="344" y="262" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">B</text><text x="344" y="37.7" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">C</text><text x="76" y="82" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">D</text><text x="210" y="270" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">AB = 6 cm</text><text x="80" y="170" font-size="13" fill="#1e293b" text-anchor="end" font-weight="700" dominant-baseline="middle">AD = 4 cm</text><text x="385" y="70" font-size="13" fill="#1e293b" text-anchor="start" font-weight="400" dominant-baseline="middle">1  Draw AB = 6 cm.</text><text x="385" y="96" font-size="13" fill="#1e293b" text-anchor="start" font-weight="400" dominant-baseline="middle">2  At A and B, draw 90°.</text><text x="385" y="122" font-size="13" fill="#1e293b" text-anchor="start" font-weight="400" dominant-baseline="middle">3  Mark D so AD = 4 cm.</text><text x="385" y="148" font-size="13" fill="#1e293b" text-anchor="start" font-weight="400" dominant-baseline="middle">4  At D, draw 100°.</text><text x="385" y="174" font-size="13" fill="#1e293b" text-anchor="start" font-weight="400" dominant-baseline="middle">5  It meets the line at B in C.</text><text x="385" y="200" font-size="13" fill="#b45309" text-anchor="start" font-weight="700" dominant-baseline="middle">6  Check: angle C = 80°.</text></svg>
