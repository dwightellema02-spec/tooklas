<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 255" width="500" height="255" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Simple interest over three years</title><desc id="d">A principal of 5,000 pesos at 4 percent simple interest earns 200 pesos each year, so it grows to 5,200, 5,400 and 5,600 pesos in three years. The interest is 600 pesos.</desc><rect width="500" height="255" fill="#ffffff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b45309"/></marker></defs><text x="250" y="22" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱5,000 at 4% simple interest per year</text><rect x="5" y="70" width="90" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="50" y="88" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">Start</text><text x="50" y="108" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱5,000</text><rect x="125" y="70" width="90" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="170" y="88" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">Year 1</text><text x="170" y="108" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱5,200</text><rect x="80" y="150" width="60" height="28" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.8"/><text x="110" y="164" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">+₱200</text><path d="M 98 98 L 122 98" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="110" y1="104" x2="110" y2="148" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><rect x="245" y="70" width="90" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="290" y="88" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">Year 2</text><text x="290" y="108" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱5,400</text><rect x="200" y="150" width="60" height="28" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.8"/><text x="230" y="164" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">+₱200</text><path d="M 218 98 L 242 98" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="230" y1="104" x2="230" y2="148" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><rect x="365" y="70" width="90" height="56" rx="8" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="410" y="88" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">Year 3</text><text x="410" y="108" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱5,600</text><rect x="320" y="150" width="60" height="28" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.8"/><text x="350" y="164" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">+₱200</text><path d="M 338 98 L 362 98" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="350" y1="104" x2="350" y2="148" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><text x="250" y="212" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">I = P × r × t = 5,000 × 0.04 × 3 = ₱600</text><text x="250" y="236" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">the same ₱200 is earned each year, because interest is on the principal only</text></svg>
