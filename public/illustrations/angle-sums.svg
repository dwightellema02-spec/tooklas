<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 270" width="510" height="270" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Angle sums of a triangle and a quadrilateral</title><desc id="d">The three angles of a triangle add up to 180 degrees. The four angles of a quadrilateral add up to 360 degrees.</desc><rect width="510" height="270" fill="#ffffff"/><polygon points="40,190 220,190 130,50" fill="#f1f5f9" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/><path d="M 40 190 L 64 190 A 24 24 0 0 0 53 169.8 Z" fill="#0f766e" fill-opacity="0.28" stroke="none"/><path d="M 64 190 A 24 24 0 0 0 53 169.8" fill="none" stroke="#0f766e" stroke-width="2.5"/><text x="75.1" y="170.8" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">a</text><path d="M 220 190 L 207 169.8 A 24 24 0 0 0 196 190 Z" fill="#b45309" fill-opacity="0.28" stroke="none"/><path d="M 207 169.8 A 24 24 0 0 0 196 190" fill="none" stroke="#b45309" stroke-width="2.5"/><text x="184.9" y="170.8" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">b</text><path d="M 130 50 L 117 70.2 A 24 24 0 0 0 143 70.2 Z" fill="#1d4ed8" fill-opacity="0.28" stroke="none"/><path d="M 117 70.2 A 24 24 0 0 0 143 70.2" fill="none" stroke="#1d4ed8" stroke-width="2.5"/><text x="130" y="90" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700" dominant-baseline="middle">c</text><text x="130" y="232" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">a + b + c = 180°</text><text x="130" y="252" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">triangle</text><polygon points="290,195 460,195 470,80 310,50" fill="#f1f5f9" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/><path d="M 290 195 L 312 195 A 22 22 0 0 0 293 173.2 Z" fill="#0f766e" fill-opacity="0.28" stroke="none"/><path d="M 312 195 A 22 22 0 0 0 293 173.2" fill="none" stroke="#0f766e" stroke-width="2.5"/><text x="318.6" y="170" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">a</text><path d="M 460 195 L 461.9 173.1 A 22 22 0 0 0 438 195 Z" fill="#b45309" fill-opacity="0.28" stroke="none"/><path d="M 461.9 173.1 A 22 22 0 0 0 438 195" fill="none" stroke="#b45309" stroke-width="2.5"/><text x="434.3" y="167" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">b</text><path d="M 470 80 L 448.4 75.9 A 22 22 0 0 0 468.1 101.9 Z" fill="#1d4ed8" fill-opacity="0.28" stroke="none"/><path d="M 448.4 75.9 A 22 22 0 0 0 468.1 101.9" fill="none" stroke="#1d4ed8" stroke-width="2.5"/><text x="439.7" y="103" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700" dominant-baseline="middle">c</text><path d="M 310 50 L 307 71.8 A 22 22 0 0 0 331.6 54.1 Z" fill="#b91c1c" fill-opacity="0.28" stroke="none"/><path d="M 307 71.8 A 22 22 0 0 0 331.6 54.1" fill="none" stroke="#b91c1c" stroke-width="2.5"/><text x="332.2" y="80.8" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="700" dominant-baseline="middle">d</text><text x="380" y="232" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">a + b + c + d = 360°</text><text x="380" y="252" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">quadrilateral</text></svg>
