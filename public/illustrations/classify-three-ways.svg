<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 265" width="480" height="265" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Classifying polygons in three ways</title><desc id="d">A regular convex hexagon and an irregular non-convex quadrilateral, each described by its number of sides, whether it is regular or irregular, and whether it is convex or non-convex.</desc><rect width="480" height="265" fill="#ffffff"/><rect x="15" y="15" width="215" height="235" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><rect x="250" y="15" width="215" height="235" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><polygon points="174,95 148,50 96,50 70,95 96,140 148,140" fill="#99f6e4" stroke="#0f766e" stroke-width="3" stroke-linejoin="round"/><rect x="40" y="165" width="165" height="21" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/><text x="122" y="176" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700" dominant-baseline="middle">6 sides: hexagon</text><rect x="40" y="191" width="165" height="21" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/><text x="122" y="202" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">regular: all equal</text><rect x="40" y="217" width="165" height="21" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.8"/><text x="122" y="228" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700" dominant-baseline="middle">convex: angles &lt; 180°</text><polygon points="357,42 425,140 357,108 289,140" fill="#fde68a" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/><rect x="275" y="165" width="165" height="21" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/><text x="357" y="176" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700" dominant-baseline="middle">4 sides: quadrilateral</text><rect x="275" y="191" width="165" height="21" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/><text x="357" y="202" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">irregular: not all equal</text><rect x="275" y="217" width="165" height="21" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8"/><text x="357" y="228" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700" dominant-baseline="middle">non-convex: angle &gt; 180°</text></svg>
