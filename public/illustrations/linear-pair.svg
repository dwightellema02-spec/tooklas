<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A linear pair of supplementary angles</title><desc id="d">Two adjacent angles of 110 degrees and 70 degrees form a straight line, so they add up to 180 degrees.</desc><rect width="480" height="240" fill="#ffffff"/><line x1="40" y1="190" x2="440" y2="190" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/><line x1="240" y1="190" x2="204.1" y2="91.3" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/><path d="M 240 190 L 310 190 A 70 70 0 0 0 216.1 124.2 Z" fill="#0f766e" fill-opacity="0.25"/><path d="M 310 190 A 70 70 0 0 0 216.1 124.2" fill="none" stroke="#0f766e" stroke-width="3"/><path d="M 240 190 L 209.2 105.4 A 90 90 0 0 0 150 190 Z" fill="#b45309" fill-opacity="0.25"/><path d="M 209.2 105.4 A 90 90 0 0 0 150 190" fill="none" stroke="#b45309" stroke-width="3"/><text x="310.7" y="119.3" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">110°</text><text x="141.6" y="128.5" font-size="17" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">70°</text><circle cx="240" cy="190" r="5" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><text x="240" y="30" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Linear pair: supplementary angles</text><text x="240" y="56" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">110° + 70° = 180°</text><text x="240" y="222" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">the two angles make a straight line</text></svg>
