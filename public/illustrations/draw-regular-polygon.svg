<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 275" width="500" height="275" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Drawing regular polygons with the angle at the centre</title><desc id="d">Points are marked on a circle every 72 degrees to draw a regular pentagon, and every 60 degrees to draw a regular hexagon, where each side equals the radius.</desc><rect width="500" height="275" fill="#ffffff"/><circle cx="125" cy="130" r="85" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="125" y1="130" x2="125" y2="45" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><line x1="125" y1="130" x2="44.2" y2="103.7" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><line x1="125" y1="130" x2="75" y2="198.8" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><line x1="125" y1="130" x2="175" y2="198.8" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><line x1="125" y1="130" x2="205.8" y2="103.7" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><polygon points="125,45 44.2,103.7 75,198.8 175,198.8 205.8,103.7" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round"/><path d="M 125 130 L 125 104 A 26 26 0 0 0 100.3 122 Z" fill="#b45309" fill-opacity="0.28" stroke="none"/><path d="M 125 104 A 26 26 0 0 0 100.3 122" fill="none" stroke="#b45309" stroke-width="2.5"/><text x="99.1" y="94.4" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">72°</text><circle cx="125" cy="45" r="4" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><circle cx="44.2" cy="103.7" r="4" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><circle cx="75" cy="198.8" r="4" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><circle cx="175" cy="198.8" r="4" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><circle cx="205.8" cy="103.7" r="4" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><circle cx="125" cy="130" r="4" fill="#1e293b" stroke="#1e293b" stroke-width="1"/><text x="127" y="144" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">O</text><text x="125" y="238" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Regular pentagon</text><text x="125" y="258" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">a point every 360° ÷ 5 = 72°</text><circle cx="365" cy="130" r="85" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="365" y1="130" x2="365" y2="45" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><line x1="365" y1="130" x2="291.4" y2="87.5" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><line x1="365" y1="130" x2="291.4" y2="172.5" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><line x1="365" y1="130" x2="365" y2="215" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><line x1="365" y1="130" x2="438.6" y2="172.5" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><line x1="365" y1="130" x2="438.6" y2="87.5" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><polygon points="365,45 291.4,87.5 291.4,172.5 365,215 438.6,172.5 438.6,87.5" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round"/><line x1="365" y1="130" x2="365" y2="45" stroke="#b45309" stroke-width="3.5" stroke-linecap="round"/><line x1="365" y1="45" x2="291.4" y2="87.5" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/><path d="M 365 130 L 365 106 A 24 24 0 0 0 344.2 118 Z" fill="#b45309" fill-opacity="0.28" stroke="none"/><path d="M 365 106 A 24 24 0 0 0 344.2 118" fill="none" 