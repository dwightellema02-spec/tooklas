<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 270" width="500" height="270" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Ordering rational numbers on a number line</title><desc id="d">A number line from 0 to 1 with 0.3, two fifths, one half and three quarters marked in order from left to right.</desc><rect width="500" height="270" fill="#ffffff"/><text x="250" y="22" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Rational numbers on a number line from 0 to 1</text><line x1="50" y1="130" x2="450" y2="130" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/><line x1="50" y1="121" x2="50" y2="139" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/><text x="50" y="158" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">0</text><line x1="90" y1="121" x2="90" y2="139" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/><text x="90" y="158" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">0.1</text><line x1="130" y1="121" x2="130" y2="139" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/><text x="130" y="158" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">0.2</text><line x1="170" y1="121" x2="170" y2="139" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/><text x="170" y="158" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">0.3</text><line x1="210" y1="121" x2="210" y2="139" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/><text x="210" y="158" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">0.4</text><line x1="250" y1="121" x2="250" y2="139" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/><text x="250" y="158" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">0.5</text><line x1="290" y1="121" x2="290" y2="139" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/><text x="290" y="158" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">0.6</text><line x1="330" y1="121" x2="330" y2="139" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/><text x="330" y="158" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">0.7</text><line x1="370" y1="121" x2="370" y2="139" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/><text x="370" y="158" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">0.8</text><line x1="410" y1="121" x2="410" y2="139" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/><text x="410" y="158" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">0.9</text><line x1="450" y1="121" x2="450" y2="139" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/><text x="450" y="158" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">1</text><line x1="170" y1="126" x2="170" y2="76" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="170" cy="130" r="7" fill="#1d4ed8" stroke="#ffffff" stroke-width="2.5"/><text x="170" y="62" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700" dominant-baseline="middle">0.3</text><line x1="210" y1="126" x2="210" y2="104" stroke="#15803d" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="210" cy="130" r="7" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/><text x="210" y="90" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700" dominant-baseline="middle">2/5</text><line x1="250" y1="126" x2="250" y2="76" stroke="#b45309" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="250" cy="130" r="7" fill="#b45309" stroke="#ffffff" stroke-width="2.5"/><text x="250" y="62" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">1/2</text><line x1="350" y1="126" x2="350" y2="104" stroke="#0f766e" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="350" cy="130" r="7" fill="#0f766e" stroke="#ffffff" stroke-width="2.5"/><text x="350" y="90" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">3/4 = 0.75</text><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs><path d="M 60 200 L 440 200" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><text x="250" y="222" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">greater →  (to the right)</text><text x="250" y="252" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Order: 0.3  &lt;  2/5  &lt;  1/2  &lt;  3/4</text></svg>
