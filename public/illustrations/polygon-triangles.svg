<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 290" width="490" height="290" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Cutting polygons into triangles</title><desc id="d">A pentagon is cut into 3 triangles from one vertex, so its angles add up to 3 times 180 degrees, 540 degrees. A hexagon is cut into 4 triangles, so its angles add up to 720 degrees.</desc><rect width="490" height="290" fill="#ffffff"/><polygon points="125,50 44.2,108.7 75,203.8" fill="#99f6e4" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/><polygon points="125,50 75,203.8 175,203.8" fill="#fde68a" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/><polygon points="125,50 175,203.8 205.8,108.7" fill="#bfdbfe" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/><polygon points="125,50 44.2,108.7 75,203.8 175,203.8 205.8,108.7" fill="none" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/><text x="125" y="250" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Pentagon: 5 − 2 = 3 triangles</text><text x="125" y="270" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">3 × 180° = 540°</text><polygon points="360,50 286.4,92.5 286.4,177.5" fill="#99f6e4" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/><polygon points="360,50 286.4,177.5 360,220" fill="#fde68a" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/><polygon points="360,50 360,220 433.6,177.5" fill="#bfdbfe" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/><polygon points="360,50 433.6,177.5 433.6,92.5" fill="#fecaca" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/><polygon points="360,50 286.4,92.5 286.4,177.5 360,220 433.6,177.5 433.6,92.5" fill="none" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/><text x="360" y="250" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Hexagon: 6 − 2 = 4 triangles</text><text x="360" y="270" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">4 × 180° = 720°</text></svg>
