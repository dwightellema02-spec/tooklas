<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" width="540" height="240" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Polygon or not a polygon</title><desc id="d">One closed figure with straight sides is a polygon. An open figure, a figure with a curved side and a figure whose sides cross are not polygons.</desc><rect width="540" height="240" fill="#ffffff"/><polygon points="35,60 93,40 105,100 65,135 27,105" fill="#99f6e4" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"/><polyline points="160,125 180,50 210,115 235,60" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/><circle cx="160" cy="125" r="4" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><circle cx="235" cy="60" r="4" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><path d="M 297 120 L 297 55 L 373 55 Q 387 120 297 120 Z" fill="#fde68a" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round"/><polygon points="435,55 505,125 505,55 435,125" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5" stroke-linejoin="round"/><text x="65" y="168" font-size="26" fill="#15803d" text-anchor="middle" font-weight="700" dominant-baseline="middle">✓</text><text x="65" y="198" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700" dominant-baseline="middle">Polygon</text><text x="65" y="218" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">closed, straight sides</text><text x="200" y="168" font-size="26" fill="#b91c1c" text-anchor="middle" font-weight="700" dominant-baseline="middle">✗</text><text x="200" y="198" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="700" dominant-baseline="middle">Not a polygon</text><text x="200" y="218" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">open (not closed)</text><text x="335" y="168" font-size="26" fill="#b91c1c" text-anchor="middle" font-weight="700" dominant-baseline="middle">✗</text><text x="335" y="198" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="700" dominant-baseline="middle">Not a polygon</text><text x="335" y="218" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">has a curved side</text><text x="470" y="168" font-size="26" fill="#b91c1c" text-anchor="middle" font-weight="700" dominant-baseline="middle">✗</text><text x="470" y="198" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="700" dominant-baseline="middle">Not a polygon</text><text x="470" y="218" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">sides cross in the middle</text></svg>
