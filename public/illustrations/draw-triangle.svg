<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" width="540" height="270" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Drawing a triangle with given angles</title><desc id="d">Triangle ABC with AB equal to 5 centimeters, angle A equal to 50 degrees and angle B equal to 60 degrees. The third angle C is 70 degrees. Steps are listed beside the figure.</desc><rect width="540" height="270" fill="#ffffff"/><line x1="60" y1="215" x2="350" y2="215" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><line x1="60" y1="215" x2="227.4" y2="15.5" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><polygon points="60,215 310,215 208.1,38.5" fill="#f1f5f9" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/><path d="M 60 215 L 94 215 A 34 34 0 0 0 81.9 189 Z" fill="#0f766e" fill-opacity="0.28" stroke="none"/><path d="M 94 215 A 34 34 0 0 0 81.9 189" fill="none" stroke="#0f766e" stroke-width="2.5"/><text x="110.8" y="191.3" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">50°</text><path d="M 310 215 L 295 189 A 30 30 0 0 0 280 215 Z" fill="#b45309" fill-opacity="0.28" stroke="none"/><path d="M 295 189 A 30 30 0 0 0 280 215" fill="none" stroke="#b45309" stroke-width="2.5"/><text x="265" y="189" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">60°</text><path d="M 208.1 38.5 L 190.1 60 A 28 28 0 0 0 222.1 62.8 Z" fill="#1d4ed8" fill-opacity="0.28" stroke="none"/><path d="M 190.1 60 A 28 28 0 0 0 222.1 62.8" fill="none" stroke="#1d4ed8" stroke-width="2.5"/><text x="203.9" y="86.3" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700" dominant-baseline="middle">70°</text><circle cx="60" cy="215" r="5" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><circle cx="310" cy="215" r="5" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><circle cx="208.1" cy="38.5" r="5" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><text x="46" y="227" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">A</text><text x="324" y="227" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">B</text><text x="212.1" y="22.5" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">C</text><text x="185" y="244" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">AB = 5 cm</text><text x="365" y="70" font-size="13" fill="#1e293b" text-anchor="start" font-weight="400" dominant-baseline="middle">1  Draw AB = 5 cm.</text><text x="365" y="98" font-size="13" fill="#1e293b" text-anchor="start" font-weight="400" dominant-baseline="middle">2  At A, mark 50°.</text><text x="365" y="126" font-size="13" fill="#1e293b" text-anchor="start" font-weight="400" dominant-baseline="middle">3  At B, mark 60°.</text><text x="365" y="154" font-size="13" fill="#1e293b" text-anchor="start" font-weight="400" dominant-baseline="middle">4  The rays meet at C.</text><text x="365" y="182" font-size="13" fill="#1d4ed8" text-anchor="start" font-weight="700" dominant-baseline="middle">5  Check: angle C = 70°.</text></svg>
