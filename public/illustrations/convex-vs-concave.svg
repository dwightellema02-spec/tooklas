<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 285" width="480" height="285" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Convex and non-convex polygons</title><desc id="d">A convex pentagon has all angles less than 180 degrees and any line between two inside points stays inside. A non-convex arrowhead has one angle greater than 180 degrees and a line between two points can leave the shape.</desc><rect width="480" height="285" fill="#ffffff"/><polygon points="120,52 45.8,105.9 74.2,193.1 165.8,193.1 194.2,105.9" fill="#99f6e4" stroke="#0f766e" stroke-width="3" stroke-linejoin="round"/><path d="M 120 52 L 107.1 61.4 A 16 16 0 0 0 132.9 61.4 Z" fill="#b45309" fill-opacity="0.28" stroke="none"/><path d="M 107.1 61.4 A 16 16 0 0 0 132.9 61.4" fill="none" stroke="#b45309" stroke-width="2.5"/><path d="M 45.8 105.9 L 50.8 121.1 A 16 16 0 0 0 58.8 96.5 Z" fill="#b45309" fill-opacity="0.28" stroke="none"/><path d="M 50.8 121.1 A 16 16 0 0 0 58.8 96.5" fill="none" stroke="#b45309" stroke-width="2.5"/><path d="M 74.2 193.1 L 90.2 193.1 A 16 16 0 0 0 69.2 177.9 Z" fill="#b45309" fill-opacity="0.28" stroke="none"/><path d="M 90.2 193.1 A 16 16 0 0 0 69.2 177.9" fill="none" stroke="#b45309" stroke-width="2.5"/><path d="M 165.8 193.1 L 170.8 177.9 A 16 16 0 0 0 149.8 193.1 Z" fill="#b45309" fill-opacity="0.28" stroke="none"/><path d="M 170.8 177.9 A 16 16 0 0 0 149.8 193.1" fill="none" stroke="#b45309" stroke-width="2.5"/><path d="M 194.2 105.9 L 181.2 96.5 A 16 16 0 0 0 189.2 121.1 Z" fill="#b45309" fill-opacity="0.28" stroke="none"/><path d="M 181.2 96.5 A 16 16 0 0 0 189.2 121.1" fill="none" stroke="#b45309" stroke-width="2.5"/><line x1="31.8" y1="109.9" x2="179.8" y2="187.1" stroke="#15803d" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/><circle cx="31.8" cy="109.9" r="4" fill="#15803d" stroke="#15803d" stroke-width="1"/><circle cx="179.8" cy="187.1" r="4" fill="#15803d" stroke="#15803d" stroke-width="1"/><text x="120" y="228" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">Convex</text><text x="120" y="248" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">all angles less than 180°</text><text x="120" y="266" font-size="12" fill="#15803d" text-anchor="middle" font-weight="400" dominant-baseline="middle">a line between two points stays inside</text><polygon points="360,38 455,200 360,140 265,200" fill="#fde68a" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/><path d="M 360 140 L 378.6 151.7 A 22 22 0 1 0 341.4 151.7 Z" fill="#b91c1c" fill-opacity="0.28" stroke="none"/><path d="M 378.6 151.7 A 22 22 0 1 0 341.4 151.7" fill="none" stroke="#b91c1c" stroke-width="2.5"/><text x="360" y="100" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700" dominant-baseline="middle">245°</text><line x1="455" y1="200" x2="265" y2="200" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/><circle cx="455" cy="200" r="4" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><circle cx="265" cy="200" r="4" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><text x="360" y="222" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="400" dominant-baseline="middle">outside the shape</text><text x="360" y="248" font-size="16" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">Non-convex (concave)</text><text x="360" y="266" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">one angle greater than 180°</text></svg>
