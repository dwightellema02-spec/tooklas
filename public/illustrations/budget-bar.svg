<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A one-day budget plan as a bar</title><desc id="d">A daily allowance of 150 pesos shown as a bar split into food 50 percent (75 pesos), transportation 20 percent (30 pesos), savings 20 percent (30 pesos) and other uses 10 percent (15 pesos). The percentages add up to 100 percent.</desc><rect width="480" height="240" fill="#ffffff"/><text x="240" y="22" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">A ₱150 daily allowance = 100%</text><rect x="40" y="60" width="200" height="56" rx="4" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="140" y="80" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">50%</text><text x="140" y="100" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱75</text><text x="140" y="136" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" dominant-baseline="middle">Food</text><rect x="240" y="60" width="80" height="56" rx="4" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="280" y="80" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="700" dominant-baseline="middle">20%</text><text x="280" y="100" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱30</text><text x="280" y="136" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" dominant-baseline="middle">Transport</text><rect x="320" y="60" width="80" height="56" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="2"/><text x="360" y="80" font-size="15" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">20%</text><text x="360" y="100" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱30</text><text x="360" y="136" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" dominant-baseline="middle">Savings</text><rect x="400" y="60" width="40" height="56" rx="4" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><text x="420" y="80" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="700" dominant-baseline="middle">10%</text><text x="420" y="100" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700" dominant-baseline="middle">₱15</text><text x="420" y="136" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" dominant-baseline="middle">Other</text><path d="M 40 150 L 40 158 L 440 158 L 440 150" fill="none" stroke="#1e293b" stroke-width="2"/><text x="240" y="176" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">50% + 20% + 20% + 10% = 100%</text><text x="240" y="202" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">amount = percent × income</text><text x="240" y="220" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">savings = income − expenses</text></svg>
