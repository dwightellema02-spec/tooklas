<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 235" width="510" height="235" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Adjacent angles</title><desc id="d">Two angles that share a vertex and one common side without overlapping: an angle of 40 degrees next to an angle of 65 degrees.</desc><rect width="510" height="235" fill="#ffffff"/><line x1="90" y1="200" x2="320" y2="200" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/><line x1="90" y1="200" x2="266.2" y2="52.2" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/><line x1="90" y1="200" x2="51.2" y2="55.1" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/><path d="M 90 200 L 190 200 A 100 100 0 0 0 166.6 135.7 Z" fill="#0f766e" fill-opacity="0.28"/><path d="M 190 200 A 100 100 0 0 0 166.6 135.7" fill="none" stroke="#0f766e" stroke-width="3"/><path d="M 90 200 L 151.3 148.6 A 80 80 0 0 0 69.3 122.7 Z" fill="#b45309" fill-opacity="0.28"/><path d="M 151.3 148.6 A 80 80 0 0 0 69.3 122.7" fill="none" stroke="#b45309" stroke-width="3"/><text x="207.5" y="157.2" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="700" dominant-baseline="middle">40°</text><text x="123.4" y="97.3" font-size="16" fill="#b45309" text-anchor="middle" font-weight="700" dominant-baseline="middle">65°</text><circle cx="90" cy="200" r="5" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><text x="78" y="214" font-size="12" fill="#b91c1c" text-anchor="end" font-weight="400" dominant-baseline="middle">vertex</text><text x="289" y="98.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">common side</text><text x="380" y="85" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700" dominant-baseline="middle">Adjacent angles</text><text x="380" y="113" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">share a vertex and a side,</text><text x="380" y="131" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle">and do not overlap</text></svg>
